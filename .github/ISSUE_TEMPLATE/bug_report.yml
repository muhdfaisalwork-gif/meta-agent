name: Bug Report
description: Report an issue with Meta Nexus Agent
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, FFmpeg & Model
      placeholder: Windows 11 / Python 3.11+ / FFmpeg 9.0 / Ollama qwen2.5
    validations:
      required: true

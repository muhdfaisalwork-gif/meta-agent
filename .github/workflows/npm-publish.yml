name: Publish Package to GitHub Packages

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@muhdfaisalwork-gif"

      - name: Run npm package smoke test
        run: npm test

      - name: Publish @muhdfaisalwork-gif/meta-agent to GitHub Packages
        run: |
          npm publish --ignore-scripts || echo "Version already published to GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
